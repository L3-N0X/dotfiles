# Helix Theme Template using Material You with optimized contrast and distinct UI roles

# --- Syntax Elements ---

"attribute" = "#d7e8cd"
"type" = "#3f6836"
"type.enum.variant" = "#3f6836"
"constructor" = "#bcebef"

"constant" = "#c0efb0"
"constant.character" = "#c0efb0"
"constant.character.escape" = "#1e4d51"

"string" = "#bbcbb2"
"string.regexp" = "#1e4d51"
"string.special" = "#bcebef"
"string.special.symbol" = "#ffb4ab"

"comment" = { fg = "#c3c8bc", modifiers = ["italic"] }

"variable" = "#e1e4da"
"variable.parameter" = { fg = "#93000a", modifiers = ["italic"] }
"variable.builtin" = "#ffb4ab"
"variable.other.member" = "#a4d396"

"label" = "#bcebef"

"punctuation" = "#c3c8bc"
"punctuation.special" = "#bbcbb2"

"keyword" = "#a4d396"
"keyword.control.conditional" = { fg = "#a4d396", modifiers = ["italic"] }

"operator" = "#8d9387"

"function" = "#a0cfd2"
"function.macro" = "#285021"

"tag" = "#a4d396"
"namespace" = { fg = "#3f6836", modifiers = ["italic"] }

"special" = "#a0cfd2"

# --- Markup ---

"markup.heading.1" = "#ffb4ab"
"markup.heading.2" = "#a4d396"
"markup.heading.3" = "#bbcbb2"
"markup.heading.4" = "#a0cfd2"
"markup.heading.5" = "#c0efb0"
"markup.heading.6" = "#285021"

"markup.list" = "#bbcbb2"
"markup.list.unchecked" = "#c3c8bc"
"markup.list.checked" = "#c0efb0"

"markup.bold" = { fg = "#a4d396", modifiers = ["bold"] }
"markup.italic" = { fg = "#bbcbb2", modifiers = ["italic"] }

"markup.link.url" = { fg = "#a4d396", modifiers = ["italic", "underlined"] }
"markup.link.text" = "#c0efb0"
"markup.link.label" = "#a0cfd2"
"markup.raw" = "#bcebef"
"markup.quote" = "#1e4d51"

# --- Diff ---

"diff.plus" = "#a0cfd2"
"diff.minus" = "#ffb4ab"
"diff.delta" = "#a4d396"

# --- UI Elements ---

"ui.background" = { fg = "#e1e4da", bg = "none" }

"ui.linenr" = { fg = "#c3c8bc" }
"ui.linenr.selected" = { fg = "#a4d396" }

"ui.statusline" = { fg = "#c3c8bc", bg = "none" }
"ui.statusline.inactive" = { fg = "#8d9387", bg = "none" }

# High contrast block indicators for modal states
"ui.statusline.normal" = { fg = "#11140f", bg = "#8d9387", modifiers = ["bold"] }
"ui.statusline.insert" = { fg = "#10380c", bg = "#a4d396", modifiers = ["bold"] }
"ui.statusline.select" = { fg = "#00373a", bg = "#a0cfd2", modifiers = ["bold"] }

"ui.popup" = { fg = "#e1e4da", bg = "none" }
"ui.window" = { fg = "#c3c8bc" }
"ui.help" = { fg = "#c3c8bc", bg = "none" }

"ui.bufferline" = { fg = "#c3c8bc", bg = "none" }
"ui.bufferline.active" = { fg = "#10380c", bg = "#a4d396", underline = { color = "#a4d396", style = "line" } }
"ui.bufferline.background" = { bg = "none" }

"ui.text" = "#e1e4da"
"ui.text.focus" = { fg = "#a4d396", bg = "none", modifiers = ["bold"] }
"ui.text.inactive" = { fg = "#c3c8bc" }
"ui.text.directory" = { fg = "#a4d396" }

"ui.virtual" = "#c3c8bc"
"ui.virtual.ruler" = { bg = "none" }
"ui.virtual.indent-guide" = "#191d17"
"ui.virtual.inlay-hint" = { fg = "#c3c8bc", bg = "none" }
"ui.virtual.jump-label" = { fg = "#285021", modifiers = ["bold"] }

# Selection differentiation
"ui.selection" = { bg = "#32362f" }
"ui.selection.primary" = { bg = "#285021" }

# Multi-state cursor mappings to completely eliminate anchor/head blending
"ui.cursor" = { fg = "#11140f", bg = "#e1e4da" }
"ui.cursor.normal" = { fg = "#11140f", bg = "#8d9387" }
"ui.cursor.insert" = { fg = "#10380c", bg = "#a4d396" }
"ui.cursor.select" = { fg = "#00373a", bg = "#a0cfd2" }

"ui.cursor.primary" = { fg = "#11140f", bg = "#e1e4da", modifiers = ["bold"] }
"ui.cursor.primary.normal" = { fg = "#11140f", bg = "#8d9387", modifiers = ["bold"] }
"ui.cursor.primary.insert" = { fg = "#10380c", bg = "#a4d396", modifiers = ["bold"] }
"ui.cursor.primary.select" = { fg = "#00373a", bg = "#a0cfd2", modifiers = ["bold"] }

"ui.cursor.match" = { bg = "#3c4b37", modifiers = ["bold"] }

"ui.highlight" = { bg = "#3c4b37", modifiers = ["bold"] }

"ui.menu" = { fg = "#e1e4da", bg = "none" }
"ui.menu.selected" = { fg = "#a4d396", bg = "none", modifiers = ["bold"] }

# --- Diagnostics ---

"diagnostic.error" = { fg = "#ffb4ab", underline = { color = "#ffb4ab", style = "curl" } }
"diagnostic.warning" = { fg = "#bbcbb2", underline = { color = "#bbcbb2", style = "curl" } }
"diagnostic.info" = { fg = "#a0cfd2", underline = { color = "#a0cfd2", style = "curl" } }
"diagnostic.hint" = { fg = "#1e4d51", underline = { color = "#1e4d51", style = "curl" } }
"diagnostic.unnecessary" = { modifiers = ["dim"] }

# --- Fallbacks (non-template usage) ---

error = "#ffb4ab"
warning = "#a0cfd2"
info = "#a4d396"
hint = "#bbcbb2"
