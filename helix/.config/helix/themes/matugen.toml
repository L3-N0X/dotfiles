# Helix Theme Template using Material You with optimized contrast and distinct UI roles

# --- Syntax Elements ---

"attribute" = "#ffdad7"
"type" = "#904a47"
"type.enum.variant" = "#904a47"
"constructor" = "#ffdea8"

"constant" = "#ffdad7"
"constant.character" = "#ffdad7"
"constant.character.escape" = "#594319"

"string" = "#e7bdba"
"string.regexp" = "#594319"
"string.special" = "#ffdea8"
"string.special.symbol" = "#ffb4ab"

"comment" = { fg = "#d8c2c0", modifiers = ["italic"] }

"variable" = "#f1dedd"
"variable.parameter" = { fg = "#93000a", modifiers = ["italic"] }
"variable.builtin" = "#ffb4ab"
"variable.other.member" = "#ffb3af"

"label" = "#ffdea8"

"punctuation" = "#d8c2c0"
"punctuation.special" = "#e7bdba"

"keyword" = "#ffb3af"
"keyword.control.conditional" = { fg = "#ffb3af", modifiers = ["italic"] }

"operator" = "#a08c8b"

"function" = "#e2c28c"
"function.macro" = "#733331"

"tag" = "#ffb3af"
"namespace" = { fg = "#904a47", modifiers = ["italic"] }

"special" = "#e2c28c"

# --- Markup ---

"markup.heading.1" = "#ffb4ab"
"markup.heading.2" = "#ffb3af"
"markup.heading.3" = "#e7bdba"
"markup.heading.4" = "#e2c28c"
"markup.heading.5" = "#ffdad7"
"markup.heading.6" = "#733331"

"markup.list" = "#e7bdba"
"markup.list.unchecked" = "#d8c2c0"
"markup.list.checked" = "#ffdad7"

"markup.bold" = { fg = "#ffb3af", modifiers = ["bold"] }
"markup.italic" = { fg = "#e7bdba", modifiers = ["italic"] }

"markup.link.url" = { fg = "#ffb3af", modifiers = ["italic", "underlined"] }
"markup.link.text" = "#ffdad7"
"markup.link.label" = "#e2c28c"
"markup.raw" = "#ffdea8"
"markup.quote" = "#594319"

# --- Diff ---

"diff.plus" = "#e2c28c"
"diff.minus" = "#ffb4ab"
"diff.delta" = "#ffb3af"

# --- UI Elements ---

"ui.background" = { fg = "#f1dedd", bg = "none" }

"ui.linenr" = { fg = "#d8c2c0" }
"ui.linenr.selected" = { fg = "#ffb3af" }

"ui.statusline" = { fg = "#d8c2c0", bg = "none" }
"ui.statusline.inactive" = { fg = "#a08c8b", bg = "none" }

# High contrast block indicators for modal states
"ui.statusline.normal" = { fg = "#571d1c", bg = "#ffb3af", modifiers = ["bold"] }
"ui.statusline.insert" = { fg = "#442928", bg = "#e7bdba", modifiers = ["bold"] }
"ui.statusline.select" = { fg = "#402d05", bg = "#e2c28c", modifiers = ["bold"] }

"ui.popup" = { fg = "#f1dedd", bg = "none" }
"ui.window" = { fg = "#d8c2c0" }
"ui.help" = { fg = "#d8c2c0", bg = "none" }

"ui.bufferline" = { fg = "#d8c2c0", bg = "none" }
"ui.bufferline.active" = { fg = "#571d1c", bg = "#ffb3af", underline = { color = "#ffb3af", style = "line" } }
"ui.bufferline.background" = { bg = "none" }

"ui.text" = "#f1dedd"
"ui.text.focus" = { fg = "#ffb3af", bg = "none", modifiers = ["bold"] }
"ui.text.inactive" = { fg = "#d8c2c0" }
"ui.text.directory" = { fg = "#ffb3af" }

"ui.virtual" = "#d8c2c0"
"ui.virtual.ruler" = { bg = "none" }
"ui.virtual.indent-guide" = "#231919"
"ui.virtual.inlay-hint" = { fg = "#d8c2c0", bg = "none" }
"ui.virtual.jump-label" = { fg = "#733331", modifiers = ["bold"] }

# Selection differentiation
"ui.selection" = { bg = "#3d3231" }
"ui.selection.primary" = { bg = "#733331" }

# Multi-state cursor mappings to completely eliminate anchor/head blending
"ui.cursor" = { fg = "#1a1111", bg = "#f1dedd" }
"ui.cursor.normal" = { fg = "#571d1c", bg = "#ffb3af" }
"ui.cursor.insert" = { fg = "#442928", bg = "#e7bdba" }
"ui.cursor.select" = { fg = "#402d05", bg = "#e2c28c" }

"ui.cursor.primary" = { fg = "#1a1111", bg = "#f1dedd", modifiers = ["bold"] }
"ui.cursor.primary.normal" = { fg = "#571d1c", bg = "#ffb3af", modifiers = ["bold"] }
"ui.cursor.primary.insert" = { fg = "#442928", bg = "#e7bdba", modifiers = ["bold"] }
"ui.cursor.primary.select" = { fg = "#402d05", bg = "#e2c28c", modifiers = ["bold"] }

"ui.cursor.match" = { bg = "#5d3f3d", modifiers = ["bold"] }

"ui.highlight" = { bg = "#5d3f3d", modifiers = ["bold"] }

"ui.menu" = { fg = "#f1dedd", bg = "none" }
"ui.menu.selected" = { fg = "#ffb3af", bg = "none", modifiers = ["bold"] }

# --- Diagnostics ---

"diagnostic.error" = { fg = "#ffb4ab", underline = { color = "#ffb4ab", style = "curl" } }
"diagnostic.warning" = { fg = "#e7bdba", underline = { color = "#e7bdba", style = "curl" } }
"diagnostic.info" = { fg = "#e2c28c", underline = { color = "#e2c28c", style = "curl" } }
"diagnostic.hint" = { fg = "#594319", underline = { color = "#594319", style = "curl" } }
"diagnostic.unnecessary" = { modifiers = ["dim"] }

# --- Fallbacks (non-template usage) ---

error = "#ffb4ab"
warning = "#e2c28c"
info = "#ffb3af"
hint = "#e7bdba"
