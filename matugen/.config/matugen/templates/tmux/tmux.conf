# ~/.config/matugen/templates/tmux.conf
# This is a Matugen template. The double braces will be replaced with real hex codes.

# Ensure the status bar background is completely transparent
set -g status-style "bg=default,fg={{colors.on_surface.default.hex}}"

# Left Status: Shows current session name with icon (Text-only accent)
set -g status-left "#[fg={{colors.primary.default.hex}},bold] 󰘔 #S  "
set -g status-left-length 20

# Active window tab: Just bold text in your wallpaper's primary accent color
setw -g window-status-current-style "bg=default,fg={{colors.primary.default.hex}},bold"
setw -g window-status-current-format " #I:#W* "

# Inactive window tabs: Muted/dimmed text color
setw -g window-status-style "bg=default,fg={{colors.on_surface_variant.default.hex}}"
setw -g window-status-format " #I:#W  "

# Right Status: Date & Time with your clean icons (Text-only accents)
set -g status-right "#[fg={{colors.secondary.default.hex}}] 󰃭 %Y-%m-%d │ #[fg={{colors.primary.default.hex}},bold]󱑒 %H:%M "
set -g status-right-length 50

# Clean, thin borders for your pane splits
set -g pane-border-style "fg={{colors.outline_variant.default.hex}}"
set -g pane-active-border-style "fg={{colors.primary.default.hex}}"