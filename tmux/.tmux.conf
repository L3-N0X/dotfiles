set -g status-position bottom
set -g status-justify left

# Load the minimal, text-only colors generated dynamically by Matugen.
# This will override the defaults below with your actual wallpaper scheme.
if-shell "test -f ~/.config/tmux/matugen-colors.conf" "source-file ~/.config/tmux/matugen-colors.conf"

# Setup the Command Prompt styling (Keep it text-focused too)
set -g message-style "bg=default,fg=red,bold"

# =====================================================================
# 5. PLUGIN MANAGEMENT (TPM) & SESSION PERSISTENCE
# =====================================================================
# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Resurrect Settings: Restore Neovim/Vim sessions if a Session.vim is present
set -g @resurrect-strategy-vim 'session'
set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-capture-pane-contents 'on' # Restores text inside panes

# Continuum Settings: Auto-save every 15 mins & auto-restore on tmux server start
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
