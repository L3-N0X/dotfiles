# =====================================================================
# 1. PREFIX & SETTINGS
# =====================================================================
# Set prefix to Ctrl + a (Perfect with your Hyprland Caps-to-Ctrl tweak)
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# Absolute Must: Force true 24-bit color support for Catppuccin Hex Codes
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:Tc"

# Enable mouse mode for easy scrolling/clicking on your tablet
set -g mouse on

# Stop automatic window renaming
set-option -g allow-rename off

# Fast config reload
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

# =====================================================================
# 2. GERMAN LAYOUT INTUITIVE SPLITS
# =====================================================================
# Horizontal split using '-' (Panes sit top/bottom)
unbind '"'
bind - split-window -v -c "#{pane_current_path}"

# Vertical split using '#' (Panes sit side-by-side)
unbind %
bind '#' split-window -h -c "#{pane_current_path}"

# =====================================================================
# 3. DUAL-NAVIGATION SYSTEM (Prefix + Arrows OR Vim keys)
# =====================================================================
# Method A: Vim Navigation keys (Ctrl+a then h, j, k, or l)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Method B: Arrow Navigation keys (Ctrl+a then Left, Down, Up, or Right)
bind Left select-pane -L
bind Down select-pane -D
bind Up select-pane -U
bind Right select-pane -R

source-file ~/.config/tmux/matugen-colors.conf

